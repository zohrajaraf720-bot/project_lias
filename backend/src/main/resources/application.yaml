server:
  port: 8080

spring:
  application:
    name: lias
  main:
    allow-circular-references: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
      
  # --- AJOUT DE LA CONFIGURATION MAIL ICI ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

lias:
  cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000 # 24 heures
      refresh-expiration-ms: 604800000 # 7 jours
  publications:
    associes-autorises: true
  upload:
    dir: uploads/

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    ma.univh2c.fsbm.lias: INFO